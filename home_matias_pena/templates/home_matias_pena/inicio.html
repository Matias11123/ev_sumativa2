{% extends 'base.html' %}

{% block title %}Inicio - Géneros{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Géneros Cinematográficos</h1>
<div class="row">
    {% for key, genero in generos.items %}
    <div class="col-md-6 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-primary">{{ genero.nombre_genero }}</h3>
                <p class="card-text">{{ genero.descripcion }}</p>
                <a href="{% url 'home:detalle_genero' key %}" class="btn btn-primary">Ver Películas</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
